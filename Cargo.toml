[workspace]
resolver = "2"
members = ["sparkbox-core", "sparkbox-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/devfahim00/SparkBoxCore"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
